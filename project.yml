name: Paseo
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  # 签名团队和 bundle ID 在这里（以及不进仓库的 Config/Local.xcconfig），见 README。
  Debug: Config/Paseo.xcconfig
  Release: Config/Paseo.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # 界面文案：中文为源语言，英文翻译在各 target 的 Localizable.xcstrings（编译时自动收集 SwiftUI 文案）
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0.33"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PaseoKit:
    path: PaseoKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.99.2"
schemes:
  Paseo:
    build:
      targets:
        Paseo: all
    test:
      targets: [PaseoTests]
      environmentVariables:
        PASEO_HOSTS_KEY: performance-tests
  PaseoMobile:
    build:
      targets:
        Paseo: all
    test:
      targets: [PaseoMobileTests]
      environmentVariables:
        PASEO_HOSTS_KEY: performance-tests
targets:
  PaseoMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests/SidebarTestFixture.swift
      - AppTests/ScheduledSidebarTests.swift
      - AppTests/VisualizationTests.swift
      - AppTests/ReplyTextTests.swift
      - AppTests/ToolPreviewLayoutTests.swift
      - MobileTests
    dependencies:
      - target: Paseo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PASEO_BUNDLE_ID).mobile-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Paseo.app/Paseo
  PaseoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes: [Fixtures]
      - path: AppTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Paseo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PASEO_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Paseo.app/Contents/MacOS/Paseo
  Paseo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
      - App/Shared
    dependencies:
      - package: PaseoKit
        product: PaseoKit
      - package: PaseoKit
        product: PaseoWatchBridge
        destinationFilters: [iOS]
      - package: SwiftTerm
      - target: PaseoWidgets
        destinationFilters: [iOS]
      - target: PaseoWatch
        embed: true
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Paseo
        # 版本号只在上面的 MARKETING_VERSION 改（scripts/release-mac.sh 会改它）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # scripts/install-mac.sh passes the commit count, so macOS refreshes its cached icon (Dock, Stage Manager).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        # 允许支持 ProMotion 的 iPhone 使用完整刷新率范围；实际帧率由系统按交互和功耗调度。
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 扫描配对二维码和拍照添加到会话
        NSPhotoLibraryUsageDescription: 选择图片发给会话
        ITSAppUsesNonExemptEncryption: false
        # 灵动岛 / 锁屏实时活动（iOS），见 App/Shared/PaseoActivity.swift。
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).activity
            CFBundleURLSchemes: [paseonative]
        # APNs 密钥必须属于签名团队，设置页用它做默认值。
        PaseoTeamID: $(DEVELOPMENT_TEAM)
        # Mac 版检查更新的 GitHub 仓库，见 Config/Paseo.xcconfig。
        PaseoReleasesRepo: $(PASEO_RELEASES_REPO)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Paseo.entitlements
      properties:
        # Not sandboxed on macOS (distributed outside the App Store) on macOS so local files in replies (screenshots
        # in /tmp, /var/folders) can be shown. iOS ignores this key.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASEO_BUNDLE_ID)
        PRODUCT_NAME: Paseo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # iOS 单独一份 entitlements（推送能力，给实时活动用）；macOS 仍用上面那份。
        # 免费 Apple ID 在 Config/Local.xcconfig 里把 PASEO_IOS_ENTITLEMENTS 换成不带推送的那份。
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(PASEO_IOS_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": $(PASEO_IOS_ENTITLEMENTS)
  # 灵动岛 / 锁屏实时活动的 Widget 扩展，只有 iOS。
  PaseoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - App/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Paseo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASEO_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  PaseoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Watch/Sources
      - Watch/Resources
    dependencies:
      - package: PaseoKit
        product: PaseoWatchBridge
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Paseo
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PASEO_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: 使用麦克风听写回复，确认后发送给会话。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASEO_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: PaseoWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    scheme: {}
